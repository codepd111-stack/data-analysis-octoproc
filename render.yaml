# Render Blueprint for the API. Postgres lives on Neon and files in an S3-compatible bucket,
# so this is the only service here. The Next.js frontend deploys separately (e.g. Vercel) with
# NEXT_PUBLIC_API_URL pointing at this service's URL.
#
# Values marked `sync: false` are entered once in the Render dashboard and never stored in git.
services:
  - type: web
    name: octoproc-data-agent-api
    runtime: docker
    rootDir: backend
    dockerfilePath: ./Dockerfile
    plan: starter
    region: singapore
    healthCheckPath: /api/health
    autoDeploy: true
    envVars:
      # --- database (Neon pooled connection string, postgresql+psycopg://...) ---
      - key: DATABASE_URL
        sync: false

      # --- AI ---
      - key: GROQ_API_KEY
        sync: false
      - key: GROQ_MODEL_MAIN
        value: openai/gpt-oss-120b
      - key: GROQ_MODEL_FAST
        value: openai/gpt-oss-20b

      # --- file storage: Render's disk is ephemeral, so s3 is mandatory here ---
      - key: STORAGE_BACKEND
        value: s3
      - key: S3_ENDPOINT_URL
        sync: false
      - key: S3_REGION
        sync: false
      - key: S3_BUCKET
        sync: false
      - key: S3_ACCESS_KEY_ID
        sync: false
      - key: S3_SECRET_ACCESS_KEY
        sync: false

      # --- web ---
      # The frontend's origin(s), comma-separated, e.g. https://octoproc.vercel.app
      - key: CORS_ORIGINS
        sync: false
      # Render terminates TLS and sets X-Forwarded-For, so the login throttle can trust it
      - key: TRUST_PROXY_HEADERS
        value: "true"

      # --- sign-in ---
      - key: ACCESS_CODE
        sync: false
      - key: AUTH_SECRET
        generateValue: true
      - key: AUTH_TOKEN_DAYS
        value: "7"
